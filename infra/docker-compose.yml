services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: car_value
    ports: ["5432:5432"]
    volumes: [car_value_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d car_value"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  car_value_pg:
